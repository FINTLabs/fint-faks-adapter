plugins {
    id 'java'
    id 'groovy'
    // shortcut: Keep javax compatibility for SOAP and FINT OAuth; revisit during the REST migration.
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version '0.52.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    cxfCodegen
}

ext['embedded-mongo.version'] = '4.33.0'
// shortcut: Patch the Boot 2.7 dependency set; replace these overrides with the Spring migration.
ext['spring-framework.version'] = '5.3.39'
ext['spring-security.version'] = '5.8.16'
ext['tomcat.version'] = '9.0.123'
ext['logback.version'] = '1.2.13'
ext['log4j2.version'] = '2.26.1'
ext['jackson-bom.version'] = '2.23.0'
ext['netty.version'] = '4.2.20.Final'
ext['reactor-bom.version'] = '2025.0.8'
ext['snakeyaml.version'] = '2.7'
ext['hibernate-validator.version'] = '6.2.6.Final'
ext['json-path.version'] = '2.10.0'
ext['json-smart.version'] = '2.6.1'
ext['commons-lang3.version'] = '3.21.0'
ext['micrometer.version'] = '1.16.8'
ext['mongodb.version'] = '4.11.5'
ext['assertj.version'] = '3.27.7'
ext['xmlunit2.version'] = '2.10.0'

dependencyManagement {
    dependencies {
        dependency 'org.springframework.security.oauth:spring-security-oauth2:2.5.2.RELEASE'
        dependency 'org.ow2.asm:asm:9.11.1'
        dependency 'commons-beanutils:commons-beanutils:1.11.0'
        dependency 'org.objenesis:objenesis:3.6'
    }
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.runtimeClasspath
    options.windowTitle = 'Fake Personnel Adapter'
    options.memberLevel = JavadocMemberLevel.PRIVATE
    destinationDir = file('./javadocs/')
}


repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url "https://repo.fintlabs.no/releases"
    }
}

dependencies {
    implementation 'org.jvnet.jaxb2_commons:jaxb2-basics-runtime:1.11.1'

    cxfCodegen 'org.apache.cxf:cxf-tools-wsdlto-frontend-jaxws:3.6.13'
    cxfCodegen 'org.apache.cxf:cxf-tools-wsdlto-databinding-jaxb:3.6.13'
    cxfCodegen 'org.jvnet.jaxb2_commons:jaxb2-basics:1.11.1'
    cxfCodegen 'jakarta.xml.ws:jakarta.xml.ws-api:2.3.3'
    cxfCodegen 'jakarta.annotation:jakarta.annotation-api:1.3.5'

    implementation('org.apache.cxf:cxf-rt-transports-http:3.6.13')
    implementation('org.apache.cxf:cxf-rt-frontend-jaxws:3.6.13')
    implementation('org.apache.cxf:cxf-rt-ws-security:3.6.13')
    implementation('jakarta.xml.ws:jakarta.xml.ws-api:2.3.3')
    implementation('jakarta.jws:jakarta.jws-api:2.1.0')
    
    implementation('org.bouncycastle:bcpkix-jdk18on:1.87')
    implementation('org.bouncycastle:bcprov-jdk18on:1.87')
    implementation('commons-io:commons-io:2.22.0')

    implementation('com.google.guava:guava:33.8.0-jre')
    implementation('org.apache.commons:commons-lang3')
    implementation('org.apache.tika:tika-core:3.3.3')

    implementation('org.glassfish.jersey.core:jersey-client:2.48')
    implementation('org.glassfish.jersey.core:jersey-common:2.48')
    implementation('org.jooq:jool-java-8:0.9.16')

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation 'no.novari:fint-model-resource:1.0.1'
    implementation('no.fint:fint-event-model:3.0.2')
    implementation('no.fint:fint-relation-model:1.1.6')
    implementation('no.fint:fint-spring-secrets:0.2.2')
    implementation('no.fint:fint-sse:2.0.1')

    implementation('no.novari:fint-arkiv-case-defaults:5.0.0')
    implementation("no.novari:fint-arkiv-resource-model-java:${apiVersion}")
    implementation("no.novari:fint-administrasjon-resource-model-java:${apiVersion}")

    implementation('org.springframework.hateoas:spring-hateoas')
    runtimeOnly('org.springframework.plugin:spring-plugin-core')
    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation('io.micrometer:micrometer-registry-prometheus-simpleclient')
    implementation('org.springframework.boot:spring-boot-devtools')
    implementation('org.springframework.boot:spring-boot-starter-hateoas')
    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation("org.springframework.boot:spring-boot-starter-data-mongodb")
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    implementation('org.springframework.boot:spring-boot-starter-validation')

    implementation('com.azure:azure-storage-blob:12.20.2')
    implementation 'io.projectreactor:reactor-core'

    implementation('com.fasterxml.jackson.core:jackson-annotations')
    implementation('com.fasterxml.jackson.core:jackson-core')
    implementation('com.fasterxml.jackson.core:jackson-databind')
    implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-xml')
    implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310')
    implementation('org.slf4j:slf4j-api:1.7.36')

    testImplementation('net.bytebuddy:byte-buddy')
    testImplementation('org.spockframework:spock-spring:2.3-groovy-3.0')
    testImplementation('org.spockframework:spock-core:2.3-groovy-3.0')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation("de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring27x:${property('embedded-mongo.version')}")

    implementation 'commons-beanutils:commons-beanutils'
    implementation 'org.apache.commons:commons-text:1.15.0'
}

task copyExternalDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/deps/external"
    exclude '**/fint-*.jar'
}

task copyFintDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/deps/fint"
    include '**/fint-*.jar'
}

build.dependsOn(copyExternalDependencies)
build.dependsOn(copyFintDependencies)

jar {
    manifest {
        attributes(
                "Manifest-Version": "1.0",
                "Main-Class": "no.novari.fint.Application",
                "Specification-Version": "${apiVersion}",
                "Implementation-Version": "${version}",
                "Class-Path": configurations.runtimeClasspath.collect { it.getName() }.join(' ')
        )
    }
}

import org.apache.tools.ant.filters.ReplaceTokens

afterEvaluate {
    configure(processResources) {
        filesMatching('**/*.yml') {
            filter(ReplaceTokens, tokens: [version: jar.archiveVersion.get(), title: jar.archiveBaseName.get()])
        }
    }
}

def generatedWsdlDir = layout.buildDirectory.dir('generated-sources/wsdl')
def svarutWsdl = 'https://svarut.ks.no/tjenester/forsendelseservice/ForsendelsesServiceV10?wsdl'

tasks.register('wsdl2java', JavaExec) {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = configurations.cxfCodegen
    mainClass = 'org.apache.cxf.tools.wsdlto.WSDLToJava'
    inputs.property('wsdlUrl', svarutWsdl)
    outputs.dir(generatedWsdlDir)
    args '-xjc-XtoString', '-client', '-p', 'no.novari.fint.arkiv.fiks.svarut',
            '-d', generatedWsdlDir.get().asFile.absolutePath, svarutWsdl
}

sourceSets.main.java.srcDir(generatedWsdlDir)
compileJava.dependsOn wsdl2java

bootJar.enabled = false
jar.archiveClassifier = ''

bootRun {
    systemProperties System.properties
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

apply from: 'https://raw.githubusercontent.com/FINTlibs/fint-buildscripts/master/dependencyReport.gradle'
