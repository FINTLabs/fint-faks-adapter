name: Build, Push and Deploy

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:

  build-push:
    uses: fintlabs/shared-workflows/.github/workflows/java-gradle-build-push.yaml@main
    with:
      java-version: '8'
    secrets: inherit

  prod:
    needs: [ build-push ]
    uses: fintlabs/shared-workflows/.github/workflows/kustomize-deploy.yaml@v0
    strategy:
      matrix:
        org:
          - bya-oslo-kommune-no
          - bym-oslo-kommune-no
          - samediggi-no
    with:
      tags: ${{ needs.build-push.outputs.tags }}
      environment: api
      org: ${{ matrix.org }}
      deploy-every-branch: false
    secrets: inherit
